# The watchdog trigger, and the alert path.
#
# WHY THE TRIGGER LIVES HERE
#   Vercel's free tier allows a scheduled job only ONCE PER DAY, which is too slow for a watchdog. It
#   cannot run on the Mac either, because the Mac is one of the things being watched -- a trigger on
#   the watched machine cannot report that machine's death. GitHub is independent of both the Mac and
#   the Cloudflare Worker, so it is the only one of the three that can notice either of them failing.
#
# WHY THE ALERT NEEDS NO EMAIL SERVICE
#   GitHub notifies the repo owner when a workflow fails. So this workflow is written to FAIL when the
#   watchdog reports a problem -- the failure IS the alert. That removes an account, a key and a
#   dependency from the design.
#
#   Known consequence: GitHub throttles scheduled workflows on inactive repositories, and may notify
#   only on the first failure of a run sequence rather than every 15 minutes. That is the right
#   behaviour for an alert anyway -- one message when something breaks, not ninety-six a day.

name: watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the watchdog to check
        env:
          WATCHDOG_URL: ${{ secrets.WATCHDOG_URL }}
        run: |
          set -euo pipefail
          url="${WATCHDOG_URL:-https://pm-watchdog.vercel.app}"
          raw=$(curl -sS --max-time 60 -w '\n%{http_code}' "$url/api/check")
          code=$(printf '%s' "$raw" | tail -n1)
          body=$(printf '%s' "$raw" | sed '$d')
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error title=The watchdog is unreachable::HTTP $code from $url/api/check. Nothing is currently watching anything."
            exit 1
          fi

          ok=$(printf '%s' "$body" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            printf '%s' "$body" | jq -r '.problems[]? | "::error title=Needs attention::" + .'
            echo "::error title=Something needs you::The control panel reported a problem. Check $url/api/status"
            exit 1
          fi

          echo "All clear."
